spring.application.name=BaskovDiscordBot
discordBot.enabled=${DISCORD_BOT_ENABLED:true}
discordBot.token=${DISCORD_BOT_TOKEN:}
discordBot.prefix=${DISCORD_BOT_PREFIX:!}
discord-bot.music.max-queue-size=${DISCORD_BOT_MUSIC_MAX_QUEUE_SIZE:100}
discord-bot.music.max-track-duration=${DISCORD_BOT_MUSIC_MAX_TRACK_DURATION:4h}
discord-bot.music.idle-disconnect-timeout=${DISCORD_BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT:5m}
discord-bot.music.default-volume=${DISCORD_BOT_MUSIC_DEFAULT_VOLUME:100}
discord-bot.music.max-volume=${DISCORD_BOT_MUSIC_MAX_VOLUME:150}
discord-bot.persistence.file=${DISCORD_BOT_PERSISTENCE_FILE:data/guild-settings.properties}
