spring.application.name=BaskovDiscordBot
discordBot.enabled=${DISCORD_BOT_ENABLED:true}
discordBot.token=${DISCORD_BOT_TOKEN:}
discordBot.prefix=${DISCORD_BOT_PREFIX:!}
discord-bot.music.max-queue-size=${DISCORD_BOT_MUSIC_MAX_QUEUE_SIZE:100}
discord-bot.music.max-track-duration=${DISCORD_BOT_MUSIC_MAX_TRACK_DURATION:4h}
discord-bot.music.idle-disconnect-timeout=${DISCORD_BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT:5m}
discord-bot.music.voice-connect-timeout=${DISCORD_BOT_MUSIC_VOICE_CONNECT_TIMEOUT:15s}
discord-bot.music.playback-ready-timeout=${DISCORD_BOT_MUSIC_PLAYBACK_READY_TIMEOUT:10s}
discord-bot.music.voice-failure-cooldown=${DISCORD_BOT_MUSIC_VOICE_FAILURE_COOLDOWN:30s}
discord-bot.music.voice-disconnect-grace=${DISCORD_BOT_MUSIC_VOICE_DISCONNECT_GRACE:5s}
discord-bot.music.voice-watchdog-enforce=${DISCORD_BOT_MUSIC_VOICE_WATCHDOG_ENFORCE:false}
discord-bot.runtime.network-mode=${DISCORD_BOT_NETWORK_MODE:bridge}
logging.level.net.dv8tion.jda.internal.audio=${DISCORD_BOT_VOICE_LOG_LEVEL:DEBUG}
discord-bot.music.default-volume=${DISCORD_BOT_MUSIC_DEFAULT_VOLUME:100}
discord-bot.music.max-volume=${DISCORD_BOT_MUSIC_MAX_VOLUME:150}
discord-bot.persistence.file=${DISCORD_BOT_PERSISTENCE_FILE:data/guild-settings.properties}

discord-bot.music-library.file=${DISCORD_BOT_MUSIC_LIBRARY_FILE:data/music-library.tsv}
