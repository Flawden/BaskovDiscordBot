services:
  bot:
    build:
      context: .
    image: baskov-discord-bot:local
    container_name: baskov-discord-bot
    restart: unless-stopped
    init: true
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required}
      DISCORD_BOT_ENABLED: "true"
      DISCORD_BOT_PREFIX: ${DISCORD_BOT_PREFIX:-!}
      DISCORD_BOT_MUSIC_MAX_QUEUE_SIZE: ${DISCORD_BOT_MUSIC_MAX_QUEUE_SIZE:-100}
      DISCORD_BOT_MUSIC_MAX_TRACK_DURATION: ${DISCORD_BOT_MUSIC_MAX_TRACK_DURATION:-4h}
      DISCORD_BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT: ${DISCORD_BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT:-5m}
      DISCORD_BOT_MUSIC_VOICE_CONNECT_TIMEOUT: ${DISCORD_BOT_MUSIC_VOICE_CONNECT_TIMEOUT:-15s}
      DISCORD_BOT_MUSIC_PLAYBACK_READY_TIMEOUT: ${DISCORD_BOT_MUSIC_PLAYBACK_READY_TIMEOUT:-10s}
      DISCORD_BOT_MUSIC_VOICE_FAILURE_COOLDOWN: ${DISCORD_BOT_MUSIC_VOICE_FAILURE_COOLDOWN:-30s}
      DISCORD_BOT_MUSIC_VOICE_DISCONNECT_GRACE: ${DISCORD_BOT_MUSIC_VOICE_DISCONNECT_GRACE:-5s}
      DISCORD_BOT_MUSIC_VOICE_WATCHDOG_ENFORCE: ${DISCORD_BOT_MUSIC_VOICE_WATCHDOG_ENFORCE:-false}
      DISCORD_BOT_NETWORK_MODE: ${BOT_NETWORK_MODE:-bridge}
      DISCORD_BOT_VOICE_LOG_LEVEL: ${DISCORD_BOT_VOICE_LOG_LEVEL:-DEBUG}
      DISCORD_BOT_MUSIC_DEFAULT_VOLUME: ${DISCORD_BOT_MUSIC_DEFAULT_VOLUME:-100}
      DISCORD_BOT_MUSIC_MAX_VOLUME: ${DISCORD_BOT_MUSIC_MAX_VOLUME:-150}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_API_BASE_URL: ${LASTFM_API_BASE_URL:-https://ws.audioscrobbler.com/2.0/}
      DISCORD_BOT_DISCOVERY_REQUEST_TIMEOUT: ${DISCORD_BOT_DISCOVERY_REQUEST_TIMEOUT:-3s}
      DISCORD_BOT_DISCOVERY_CANDIDATE_LIMIT: ${DISCORD_BOT_DISCOVERY_CANDIDATE_LIMIT:-25}
      DISCORD_BOT_PLAYBACK_PROVIDER_FAILURE_THRESHOLD: ${DISCORD_BOT_PLAYBACK_PROVIDER_FAILURE_THRESHOLD:-3}
      DISCORD_BOT_PLAYBACK_PROVIDER_COOLDOWN: ${DISCORD_BOT_PLAYBACK_PROVIDER_COOLDOWN:-90s}
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}
      LISTENBRAINZ_API_BASE_URL: ${LISTENBRAINZ_API_BASE_URL:-https://api.listenbrainz.org}
      DISCORD_BOT_COLLABORATIVE_ARTIST_LIMIT: ${DISCORD_BOT_COLLABORATIVE_ARTIST_LIMIT:-12}
      DISCORD_BOT_LISTENBRAINZ_RADIO_MODE: ${DISCORD_BOT_LISTENBRAINZ_RADIO_MODE:-medium}
      DISCORD_BOT_PERSISTENCE_FILE: /app/data/guild-settings.properties
      DISCORD_BOT_MUSIC_LIBRARY_FILE: /app/data/music-library.tsv
      DISCORD_BOT_MUSIC_SESSION_FILE: /app/data/music-sessions.tsv
      DISCORD_BOT_RECOMMENDATION_FEEDBACK_FILE: /app/data/recommendation-feedback.tsv
      DISCORD_BOT_MUSIC_SESSION_CHECKPOINT_INTERVAL: ${DISCORD_BOT_MUSIC_SESSION_CHECKPOINT_INTERVAL:-5s}
      DISCORD_BOT_MUSIC_SESSION_MAX_AGE: ${DISCORD_BOT_MUSIC_SESSION_MAX_AGE:-6h}
      DISCORD_BOT_MUSIC_SESSION_RESTORE_ON_STARTUP: ${DISCORD_BOT_MUSIC_SESSION_RESTORE_ON_STARTUP:-true}
      DISCORD_BOT_MUSIC_SESSION_REQUIRE_HUMAN_LISTENER: ${DISCORD_BOT_MUSIC_SESSION_REQUIRE_HUMAN_LISTENER:-true}
      DISCORD_BOT_MUSIC_SESSION_VOICE_RECOVERY_ENABLED: ${DISCORD_BOT_MUSIC_SESSION_VOICE_RECOVERY_ENABLED:-true}
      DISCORD_BOT_MUSIC_SESSION_MAX_RECOVERY_ATTEMPTS: ${DISCORD_BOT_MUSIC_SESSION_MAX_RECOVERY_ATTEMPTS:-3}
      DISCORD_BOT_MUSIC_SESSION_RECOVERY_BACKOFF: ${DISCORD_BOT_MUSIC_SESSION_RECOVERY_BACKOFF:-2s}
      DISCORD_BOT_OPERATIONS_PERSISTENCE_BACKUP_ENABLED: ${DISCORD_BOT_OPERATIONS_PERSISTENCE_BACKUP_ENABLED:-true}
      DISCORD_BOT_OPERATIONS_PERSISTENCE_BACKUP_DIRECTORY: /app/data/backups
      DISCORD_BOT_OPERATIONS_PERSISTENCE_BACKUP_INTERVAL: ${DISCORD_BOT_OPERATIONS_PERSISTENCE_BACKUP_INTERVAL:-6h}
      DISCORD_BOT_OPERATIONS_PERSISTENCE_BACKUP_RETENTION: ${DISCORD_BOT_OPERATIONS_PERSISTENCE_BACKUP_RETENTION:-14}
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 3s
      start_period: 45s
      retries: 4
    volumes:
      - bot-data:/app/data
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
    name: ${BOT_CONTAINER_NAME:-baskov-discord-bot}-data
