services:
  bot:
    build:
      context: .
    image: baskov-discord-bot:local
    container_name: baskov-discord-bot
    restart: unless-stopped
    init: true
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required}
      DISCORD_BOT_ENABLED: "true"
    stop_grace_period: 30s
