services:
  bot:
    environment:
      BASKOV_PRODUCT_API_ENABLED: "true"
      BASKOV_PRODUCT_API_WEB_APPLICATION_TYPE: servlet
      BASKOV_PRODUCT_API_BIND_ADDRESS: 0.0.0.0
      BASKOV_PRODUCT_API_PORT: 18080
      BASKOV_PRODUCT_API_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "127.0.0.1:${BASKOV_PRODUCT_API_HOST_PORT:-18080}:18080"
