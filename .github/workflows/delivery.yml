name: Build, Publish and Deploy

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - development
          - production
        default: development
      network_mode:
        description: Docker network mode for this run
        required: true
        type: choice
        options:
          - environment
          - bridge
          - host
        default: environment

concurrency:
  group: delivery-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  context:
    name: Resolve delivery context
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      environment: ${{ steps.resolve.outputs.environment }}
      image: ${{ steps.resolve.outputs.image }}
      default_deploy_dir: ${{ steps.resolve.outputs.default_deploy_dir }}
      default_container_name: ${{ steps.resolve.outputs.default_container_name }}
    steps:
      - name: Report GitHub-hosted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS/arch: ${RUNNER_OS}/${RUNNER_ARCH}"
          echo "Workspace: ${GITHUB_WORKSPACE}"

      - name: Resolve branch, environment and image
        id: resolve
        shell: bash
        run: |
          set -Eeuo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            environment="${{ inputs.target }}"
            if [[ "${environment}" == "production" && "${GITHUB_REF_NAME}" != "master" ]]; then
              echo "Production deployment is allowed only from master" >&2
              exit 1
            fi
          elif [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            environment="production"
          else
            environment="development"
          fi

          if [[ "${environment}" == "production" ]]; then
            channel="latest"
            default_deploy_dir="/opt/baskov-discord-bot"
            default_container_name="baskov-discord-bot"
          else
            channel="dev"
            default_deploy_dir="/opt/baskov-discord-bot-dev"
            default_container_name="baskov-discord-bot-dev"
          fi

          {
            echo "image=${image}"
            echo "environment=${environment}"
            echo "channel=${channel}"
            echo "default_deploy_dir=${default_deploy_dir}"
            echo "default_container_name=${default_container_name}"
          } >> "${GITHUB_OUTPUT}"

  publish:
    name: Verify and publish immutable image
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.project.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Validate operational assets
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x deploy/remote-deploy.sh deploy/healthcheck.sh
          bash -n deploy/remote-deploy.sh
          sh -n deploy/healthcheck.sh
          BOT_IMAGE=ghcr.io/example/baskov-discord-bot:ci \
          BOT_CONTAINER_NAME=baskov-discord-bot-ci \
          DISCORD_BOT_TOKEN=ci-placeholder \
          BOT_NETWORK_MODE=bridge \
            docker compose -f deploy/docker-compose.yml config >/dev/null
          BOT_IMAGE=ghcr.io/example/baskov-discord-bot:ci \
          BOT_CONTAINER_NAME=baskov-discord-bot-ci \
          DISCORD_BOT_TOKEN=ci-placeholder \
          BOT_NETWORK_MODE=host \
            docker compose -f deploy/docker-compose.yml \
              -f deploy/docker-compose.host-network.yml config >/dev/null

      - name: Run Maven verification
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Resolve application version
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(./mvnw --batch-mode --no-transfer-progress help:evaluate \
            -Dexpression=project.version -DforceStdout -q)"
          if [[ -z "${version}" ]]; then
            echo "Maven project version is empty" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            ${{ needs.context.outputs.image }}:sha-${{ github.sha }}
            ${{ needs.context.outputs.image }}:${{ needs.context.outputs.channel }}
          build-args: |
            APP_VERSION=${{ steps.project.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.project.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish delivery summary
        shell: bash
        run: |
          {
            echo "## Baskov Discord Bot delivery"
            echo
            echo "- Environment: \`${{ needs.context.outputs.environment }}\`"
            echo "- Application version: \`v${{ steps.project.outputs.version }}\`"
            echo "- Immutable image: \`${{ needs.context.outputs.image }}:sha-${{ github.sha }}\`"
            echo "- Channel image: \`${{ needs.context.outputs.image }}:${{ needs.context.outputs.channel }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy to VPS
    needs:
      - context
      - publish
    if: ${{ vars.BOT_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.context.outputs.environment }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: true

      - name: Configure ephemeral SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BOT_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BOT_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          ssh_dir="$(mktemp -d "${RUNNER_TEMP}/baskov-ssh.XXXXXX")"
          key_file="${ssh_dir}/id_ed25519"
          known_hosts_file="${ssh_dir}/known_hosts"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${key_file}"
          chmod 600 "${key_file}"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${known_hosts_file}"
          chmod 600 "${known_hosts_file}"
          {
            echo "BASKOV_SSH_DIR=${ssh_dir}"
            echo "BASKOV_SSH_KEY=${key_file}"
            echo "BASKOV_KNOWN_HOSTS=${known_hosts_file}"
          } >> "${GITHUB_ENV}"

      - name: Copy deployment definition
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BOT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.BOT_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.BOT_DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.BOT_DEPLOY_DIR }}
        run: |
          set -Eeuo pipefail
          deploy_dir="${DEPLOY_DIR:-${{ needs.context.outputs.default_deploy_dir }}}"
          ssh -i "${BASKOV_SSH_KEY}" -o UserKnownHostsFile="${BASKOV_KNOWN_HOSTS}" -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -d -m 700 '${deploy_dir}'"
          scp -i "${BASKOV_SSH_KEY}" -o UserKnownHostsFile="${BASKOV_KNOWN_HOSTS}" -P "${DEPLOY_PORT:-22}" \
            deploy/docker-compose.yml deploy/docker-compose.host-network.yml \
            deploy/remote-deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${deploy_dir}/"

      - name: Transfer protected deployment input
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BOT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.BOT_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.BOT_DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.BOT_DEPLOY_DIR }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BOT_IMAGE: ${{ needs.context.outputs.image }}:sha-${{ github.sha }}
          BOT_CONTAINER_NAME: ${{ vars.BOT_CONTAINER_NAME }}
          BOT_COMMAND_PREFIX: ${{ vars.DISCORD_BOT_PREFIX }}
          BOT_MUSIC_MAX_QUEUE_SIZE: ${{ vars.DISCORD_BOT_MUSIC_MAX_QUEUE_SIZE }}
          BOT_MUSIC_MAX_TRACK_DURATION: ${{ vars.DISCORD_BOT_MUSIC_MAX_TRACK_DURATION }}
          BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT: ${{ vars.DISCORD_BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT }}
          BOT_MUSIC_VOICE_CONNECT_TIMEOUT: ${{ vars.DISCORD_BOT_MUSIC_VOICE_CONNECT_TIMEOUT }}
          BOT_MUSIC_PLAYBACK_READY_TIMEOUT: ${{ vars.DISCORD_BOT_MUSIC_PLAYBACK_READY_TIMEOUT }}
          BOT_MUSIC_VOICE_FAILURE_COOLDOWN: ${{ vars.DISCORD_BOT_MUSIC_VOICE_FAILURE_COOLDOWN }}
          BOT_MUSIC_VOICE_DISCONNECT_GRACE: ${{ vars.DISCORD_BOT_MUSIC_VOICE_DISCONNECT_GRACE }}
          BOT_MUSIC_VOICE_WATCHDOG_ENFORCE: ${{ vars.DISCORD_BOT_MUSIC_VOICE_WATCHDOG_ENFORCE }}
          BOT_MUSIC_SESSION_CHECKPOINT_INTERVAL: ${{ vars.DISCORD_BOT_MUSIC_SESSION_CHECKPOINT_INTERVAL }}
          BOT_MUSIC_SESSION_MAX_AGE: ${{ vars.DISCORD_BOT_MUSIC_SESSION_MAX_AGE }}
          BOT_MUSIC_SESSION_RESTORE_ON_STARTUP: ${{ vars.DISCORD_BOT_MUSIC_SESSION_RESTORE_ON_STARTUP }}
          BOT_MUSIC_SESSION_REQUIRE_HUMAN_LISTENER: ${{ vars.DISCORD_BOT_MUSIC_SESSION_REQUIRE_HUMAN_LISTENER }}
          BOT_MUSIC_SESSION_VOICE_RECOVERY_ENABLED: ${{ vars.DISCORD_BOT_MUSIC_SESSION_VOICE_RECOVERY_ENABLED }}
          BOT_MUSIC_SESSION_MAX_RECOVERY_ATTEMPTS: ${{ vars.DISCORD_BOT_MUSIC_SESSION_MAX_RECOVERY_ATTEMPTS }}
          BOT_MUSIC_SESSION_RECOVERY_BACKOFF: ${{ vars.DISCORD_BOT_MUSIC_SESSION_RECOVERY_BACKOFF }}
          BOT_NETWORK_MODE: ${{ vars.BOT_NETWORK_MODE }}
          BOT_NETWORK_MODE_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.network_mode || '' }}
          BOT_VOICE_LOG_LEVEL: ${{ vars.DISCORD_BOT_VOICE_LOG_LEVEL }}
          BOT_MUSIC_DEFAULT_VOLUME: ${{ vars.DISCORD_BOT_MUSIC_DEFAULT_VOLUME }}
          BOT_MUSIC_MAX_VOLUME: ${{ vars.DISCORD_BOT_MUSIC_MAX_VOLUME }}
        run: |
          set -Eeuo pipefail
          deploy_dir="${DEPLOY_DIR:-${{ needs.context.outputs.default_deploy_dir }}}"
          container_name="${BOT_CONTAINER_NAME:-${{ needs.context.outputs.default_container_name }}}"
          command_prefix="${BOT_COMMAND_PREFIX:-!}"
          max_queue_size="${BOT_MUSIC_MAX_QUEUE_SIZE:-100}"
          max_track_duration="${BOT_MUSIC_MAX_TRACK_DURATION:-4h}"
          idle_disconnect_timeout="${BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT:-5m}"
          voice_connect_timeout="${BOT_MUSIC_VOICE_CONNECT_TIMEOUT:-15s}"
          playback_ready_timeout="${BOT_MUSIC_PLAYBACK_READY_TIMEOUT:-10s}"
          voice_failure_cooldown="${BOT_MUSIC_VOICE_FAILURE_COOLDOWN:-30s}"
          voice_disconnect_grace="${BOT_MUSIC_VOICE_DISCONNECT_GRACE:-5s}"
          voice_watchdog_enforce="${BOT_MUSIC_VOICE_WATCHDOG_ENFORCE:-false}"
          session_checkpoint_interval="${BOT_MUSIC_SESSION_CHECKPOINT_INTERVAL:-5s}"
          session_max_age="${BOT_MUSIC_SESSION_MAX_AGE:-6h}"
          session_restore_on_startup="${BOT_MUSIC_SESSION_RESTORE_ON_STARTUP:-true}"
          session_require_human_listener="${BOT_MUSIC_SESSION_REQUIRE_HUMAN_LISTENER:-true}"
          session_voice_recovery_enabled="${BOT_MUSIC_SESSION_VOICE_RECOVERY_ENABLED:-true}"
          session_max_recovery_attempts="${BOT_MUSIC_SESSION_MAX_RECOVERY_ATTEMPTS:-3}"
          session_recovery_backoff="${BOT_MUSIC_SESSION_RECOVERY_BACKOFF:-2s}"
          network_mode="${BOT_NETWORK_MODE:-bridge}"
          if [[ -n "${BOT_NETWORK_MODE_OVERRIDE}" && "${BOT_NETWORK_MODE_OVERRIDE}" != "environment" ]]; then
            network_mode="${BOT_NETWORK_MODE_OVERRIDE}"
          fi
          voice_log_level="${BOT_VOICE_LOG_LEVEL:-DEBUG}"
          default_volume="${BOT_MUSIC_DEFAULT_VOLUME:-100}"
          max_volume="${BOT_MUSIC_MAX_VOLUME:-150}"

          encode() {
            printf '%s' "$1" | base64 -w 0
          }

          {
            printf 'BOT_IMAGE=%s\n' "${BOT_IMAGE}"
            printf 'BOT_CONTAINER_NAME=%s\n' "${container_name}"
            printf 'DISCORD_BOT_TOKEN_B64=%s\n' "$(encode "${DISCORD_BOT_TOKEN}")"
            printf 'DISCORD_BOT_PREFIX_B64=%s\n' "$(encode "${command_prefix}")"
            printf 'DISCORD_BOT_MUSIC_MAX_QUEUE_SIZE_B64=%s\n' "$(encode "${max_queue_size}")"
            printf 'DISCORD_BOT_MUSIC_MAX_TRACK_DURATION_B64=%s\n' "$(encode "${max_track_duration}")"
            printf 'DISCORD_BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT_B64=%s\n' "$(encode "${idle_disconnect_timeout}")"
            printf 'DISCORD_BOT_MUSIC_VOICE_CONNECT_TIMEOUT_B64=%s\n' "$(encode "${voice_connect_timeout}")"
            printf 'DISCORD_BOT_MUSIC_PLAYBACK_READY_TIMEOUT_B64=%s\n' "$(encode "${playback_ready_timeout}")"
            printf 'DISCORD_BOT_MUSIC_VOICE_FAILURE_COOLDOWN_B64=%s\n' "$(encode "${voice_failure_cooldown}")"
            printf 'DISCORD_BOT_MUSIC_VOICE_DISCONNECT_GRACE_B64=%s\n' "$(encode "${voice_disconnect_grace}")"
            printf 'DISCORD_BOT_MUSIC_VOICE_WATCHDOG_ENFORCE_B64=%s\n' "$(encode "${voice_watchdog_enforce}")"
            printf 'DISCORD_BOT_MUSIC_SESSION_CHECKPOINT_INTERVAL_B64=%s\n' "$(encode "${session_checkpoint_interval}")"
            printf 'DISCORD_BOT_MUSIC_SESSION_MAX_AGE_B64=%s\n' "$(encode "${session_max_age}")"
            printf 'DISCORD_BOT_MUSIC_SESSION_RESTORE_ON_STARTUP_B64=%s\n' "$(encode "${session_restore_on_startup}")"
            printf 'DISCORD_BOT_MUSIC_SESSION_REQUIRE_HUMAN_LISTENER_B64=%s\n' "$(encode "${session_require_human_listener}")"
            printf 'DISCORD_BOT_MUSIC_SESSION_VOICE_RECOVERY_ENABLED_B64=%s\n' "$(encode "${session_voice_recovery_enabled}")"
            printf 'DISCORD_BOT_MUSIC_SESSION_MAX_RECOVERY_ATTEMPTS_B64=%s\n' "$(encode "${session_max_recovery_attempts}")"
            printf 'DISCORD_BOT_MUSIC_SESSION_RECOVERY_BACKOFF_B64=%s\n' "$(encode "${session_recovery_backoff}")"
            printf 'BOT_NETWORK_MODE_B64=%s\n' "$(encode "${network_mode}")"
            printf 'DISCORD_BOT_VOICE_LOG_LEVEL_B64=%s\n' "$(encode "${voice_log_level}")"
            printf 'DISCORD_BOT_MUSIC_DEFAULT_VOLUME_B64=%s\n' "$(encode "${default_volume}")"
            printf 'DISCORD_BOT_MUSIC_MAX_VOLUME_B64=%s\n' "$(encode "${max_volume}")"
          } | ssh -i "${BASKOV_SSH_KEY}" -o UserKnownHostsFile="${BASKOV_KNOWN_HOSTS}" -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077; cat > '${deploy_dir}/.deploy-input'"

      - name: Log in to GHCR on VPS
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BOT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.BOT_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.BOT_DEPLOY_USER }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "${GHCR_TOKEN}" | ssh -i "${BASKOV_SSH_KEY}" -o UserKnownHostsFile="${BASKOV_KNOWN_HOSTS}" -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"

      - name: Deploy immutable image with rollback
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BOT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.BOT_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.BOT_DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.BOT_DEPLOY_DIR }}
        run: |
          set -Eeuo pipefail
          deploy_dir="${DEPLOY_DIR:-${{ needs.context.outputs.default_deploy_dir }}}"
          ssh -i "${BASKOV_SSH_KEY}" -o UserKnownHostsFile="${BASKOV_KNOWN_HOSTS}" -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 700 '${deploy_dir}/remote-deploy.sh' && '${deploy_dir}/remote-deploy.sh' '${deploy_dir}'"

      - name: Remove ephemeral SSH credentials
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${BASKOV_SSH_DIR:-}" && -d "${BASKOV_SSH_DIR}" ]]; then
            rm -rf -- "${BASKOV_SSH_DIR}"
          fi

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Deployment complete"
            echo
            echo "- Environment: \`${{ needs.context.outputs.environment }}\`"
            echo "- Application version: \`v${{ needs.publish.outputs.version }}\`"
            echo "- Image: \`${{ needs.context.outputs.image }}:sha-${{ github.sha }}\`"
            echo "- Digest: \`${{ needs.publish.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
