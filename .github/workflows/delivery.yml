name: Build, Publish and Deploy

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - development
          - production
        default: development

concurrency:
  group: delivery-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  context:
    name: Resolve delivery context
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      environment: ${{ steps.resolve.outputs.environment }}
      image: ${{ steps.resolve.outputs.image }}
      default_deploy_dir: ${{ steps.resolve.outputs.default_deploy_dir }}
      default_container_name: ${{ steps.resolve.outputs.default_container_name }}
    steps:
      - name: Resolve branch, environment and image
        id: resolve
        shell: bash
        run: |
          set -Eeuo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            environment="${{ inputs.target }}"
            if [[ "${environment}" == "production" && "${GITHUB_REF_NAME}" != "master" ]]; then
              echo "Production deployment is allowed only from master" >&2
              exit 1
            fi
          elif [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            environment="production"
          else
            environment="development"
          fi

          if [[ "${environment}" == "production" ]]; then
            channel="latest"
            default_deploy_dir="/opt/baskov-discord-bot"
            default_container_name="baskov-discord-bot"
          else
            channel="dev"
            default_deploy_dir="/opt/baskov-discord-bot-dev"
            default_container_name="baskov-discord-bot-dev"
          fi

          {
            echo "image=${image}"
            echo "environment=${environment}"
            echo "channel=${channel}"
            echo "default_deploy_dir=${default_deploy_dir}"
            echo "default_container_name=${default_container_name}"
          } >> "${GITHUB_OUTPUT}"

  publish:
    name: Verify and publish immutable image
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.project.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run Maven verification
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Resolve application version
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(./mvnw --batch-mode --no-transfer-progress help:evaluate \
            -Dexpression=project.version -DforceStdout -q)"
          if [[ -z "${version}" ]]; then
            echo "Maven project version is empty" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            ${{ needs.context.outputs.image }}:sha-${{ github.sha }}
            ${{ needs.context.outputs.image }}:${{ needs.context.outputs.channel }}
          build-args: |
            APP_VERSION=${{ steps.project.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.project.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish delivery summary
        shell: bash
        run: |
          {
            echo "## Baskov Discord Bot delivery"
            echo
            echo "- Environment: \`${{ needs.context.outputs.environment }}\`"
            echo "- Application version: \`v${{ steps.project.outputs.version }}\`"
            echo "- Immutable image: \`${{ needs.context.outputs.image }}:sha-${{ github.sha }}\`"
            echo "- Channel image: \`${{ needs.context.outputs.image }}:${{ needs.context.outputs.channel }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy to VPS
    needs:
      - context
      - publish
    if: ${{ vars.BOT_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.context.outputs.environment }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
          sparse-checkout-cone-mode: true

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BOT_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BOT_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deployment definition
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BOT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.BOT_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.BOT_DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.BOT_DEPLOY_DIR }}
        run: |
          set -Eeuo pipefail
          deploy_dir="${DEPLOY_DIR:-${{ needs.context.outputs.default_deploy_dir }}}"
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -d -m 700 '${deploy_dir}'"
          scp -P "${DEPLOY_PORT:-22}" \
            deploy/docker-compose.yml deploy/remote-deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${deploy_dir}/"

      - name: Transfer protected deployment input
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BOT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.BOT_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.BOT_DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.BOT_DEPLOY_DIR }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BOT_IMAGE: ${{ needs.context.outputs.image }}:sha-${{ github.sha }}
          BOT_CONTAINER_NAME: ${{ vars.BOT_CONTAINER_NAME }}
          BOT_COMMAND_PREFIX: ${{ vars.DISCORD_BOT_PREFIX }}
          BOT_MUSIC_MAX_QUEUE_SIZE: ${{ vars.DISCORD_BOT_MUSIC_MAX_QUEUE_SIZE }}
          BOT_MUSIC_MAX_TRACK_DURATION: ${{ vars.DISCORD_BOT_MUSIC_MAX_TRACK_DURATION }}
          BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT: ${{ vars.DISCORD_BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT }}
        run: |
          set -Eeuo pipefail
          deploy_dir="${DEPLOY_DIR:-${{ needs.context.outputs.default_deploy_dir }}}"
          container_name="${BOT_CONTAINER_NAME:-${{ needs.context.outputs.default_container_name }}}"
          command_prefix="${BOT_COMMAND_PREFIX:-!}"
          max_queue_size="${BOT_MUSIC_MAX_QUEUE_SIZE:-100}"
          max_track_duration="${BOT_MUSIC_MAX_TRACK_DURATION:-4h}"
          idle_disconnect_timeout="${BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT:-5m}"

          encode() {
            printf '%s' "$1" | base64 -w 0
          }

          {
            printf 'BOT_IMAGE=%s\n' "${BOT_IMAGE}"
            printf 'BOT_CONTAINER_NAME=%s\n' "${container_name}"
            printf 'DISCORD_BOT_TOKEN_B64=%s\n' "$(encode "${DISCORD_BOT_TOKEN}")"
            printf 'DISCORD_BOT_PREFIX_B64=%s\n' "$(encode "${command_prefix}")"
            printf 'DISCORD_BOT_MUSIC_MAX_QUEUE_SIZE_B64=%s\n' "$(encode "${max_queue_size}")"
            printf 'DISCORD_BOT_MUSIC_MAX_TRACK_DURATION_B64=%s\n' "$(encode "${max_track_duration}")"
            printf 'DISCORD_BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT_B64=%s\n' "$(encode "${idle_disconnect_timeout}")"
          } | ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077; cat > '${deploy_dir}/.deploy-input'"

      - name: Log in to GHCR on VPS
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BOT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.BOT_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.BOT_DEPLOY_USER }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "${GHCR_TOKEN}" | ssh -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"

      - name: Deploy immutable image with rollback
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BOT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.BOT_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.BOT_DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.BOT_DEPLOY_DIR }}
        run: |
          set -Eeuo pipefail
          deploy_dir="${DEPLOY_DIR:-${{ needs.context.outputs.default_deploy_dir }}}"
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 700 '${deploy_dir}/remote-deploy.sh' && '${deploy_dir}/remote-deploy.sh' '${deploy_dir}'"

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Deployment complete"
            echo
            echo "- Environment: \`${{ needs.context.outputs.environment }}\`"
            echo "- Application version: \`v${{ needs.publish.outputs.version }}\`"
            echo "- Image: \`${{ needs.context.outputs.image }}:sha-${{ github.sha }}\`"
            echo "- Digest: \`${{ needs.publish.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
