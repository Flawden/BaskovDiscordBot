name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Maven and Docker verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run Maven verification
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build container image
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(./mvnw --batch-mode --no-transfer-progress help:evaluate \
            -Dexpression=project.version -DforceStdout -q)"
          docker build --pull \
            --build-arg "APP_VERSION=${version}" \
            --tag baskov-discord-bot:ci .

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
