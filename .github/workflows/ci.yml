name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Maven and Docker verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: .github/maven-cache-key.txt
          show-download-progress: true

      - name: Make Maven tooling executable
        run: chmod +x ./mvnw .github/scripts/maven-ci.sh

      - name: Validate operational assets
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x deploy/remote-deploy.sh deploy/healthcheck.sh
          bash -n deploy/remote-deploy.sh
          sh -n deploy/healthcheck.sh
          BOT_IMAGE=ghcr.io/example/baskov-discord-bot:ci \
          BOT_CONTAINER_NAME=baskov-discord-bot-ci \
          DISCORD_BOT_TOKEN=ci-placeholder \
          BOT_NETWORK_MODE=bridge \
            docker compose -f deploy/docker-compose.yml config >/dev/null
          BOT_IMAGE=ghcr.io/example/baskov-discord-bot:ci \
          BOT_CONTAINER_NAME=baskov-discord-bot-ci \
          DISCORD_BOT_TOKEN=ci-placeholder \
          BOT_NETWORK_MODE=host \
            docker compose -f deploy/docker-compose.yml \
              -f deploy/docker-compose.host-network.yml config >/dev/null

      - name: Diagnose Maven delivery environment
        run: ./.github/scripts/maven-ci.sh diagnose

      - name: Run Maven verification
        run: ./.github/scripts/maven-ci.sh verify

      - name: Build container image
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(./.github/scripts/maven-ci.sh version)"
          docker build --pull \
            --build-arg "APP_VERSION=${version}" \
            --tag baskov-discord-bot:ci .

      - name: Upload Maven diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/baskov-maven-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
