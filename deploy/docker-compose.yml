services:
  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE is required}
    container_name: ${BOT_CONTAINER_NAME:?BOT_CONTAINER_NAME is required}
    restart: unless-stopped
    init: true
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required}
      DISCORD_BOT_ENABLED: "true"
      DISCORD_BOT_PREFIX: ${DISCORD_BOT_PREFIX:-!}
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/baskov-discord-bot.ready"]
      interval: 15s
      timeout: 3s
      start_period: 45s
      retries: 4
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
