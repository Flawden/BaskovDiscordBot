services:
  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE is required}
    container_name: ${BOT_CONTAINER_NAME:?BOT_CONTAINER_NAME is required}
    restart: unless-stopped
    init: true
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required}
      DISCORD_BOT_ENABLED: "true"
      DISCORD_BOT_PREFIX: ${DISCORD_BOT_PREFIX:-!}
      DISCORD_BOT_MUSIC_MAX_QUEUE_SIZE: ${DISCORD_BOT_MUSIC_MAX_QUEUE_SIZE:-100}
      DISCORD_BOT_MUSIC_MAX_TRACK_DURATION: ${DISCORD_BOT_MUSIC_MAX_TRACK_DURATION:-4h}
      DISCORD_BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT: ${DISCORD_BOT_MUSIC_IDLE_DISCONNECT_TIMEOUT:-5m}
      DISCORD_BOT_MUSIC_DEFAULT_VOLUME: ${DISCORD_BOT_MUSIC_DEFAULT_VOLUME:-100}
      DISCORD_BOT_MUSIC_MAX_VOLUME: ${DISCORD_BOT_MUSIC_MAX_VOLUME:-150}
      DISCORD_BOT_PERSISTENCE_FILE: /app/data/guild-settings.properties
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/baskov-discord-bot.ready"]
      interval: 15s
      timeout: 3s
      start_period: 45s
      retries: 4
    volumes:
      - bot-data:/app/data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  bot-data:
    name: ${BOT_CONTAINER_NAME:-baskov-discord-bot}-data
